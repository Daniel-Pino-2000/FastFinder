name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    # FastFinder is a Windows-only desktop app (Explorer integration via
    # java.awt.Desktop, Windows-specific restricted-directory detection), so CI runs on
    # the same platform it actually ships for rather than a Linux runner that could
    # mask Windows-specific behavior.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and run tests
        run: ./gradlew.bat compileKotlin test --console=plain

      - name: Static analysis (detekt)
        run: ./gradlew.bat detekt --console=plain
